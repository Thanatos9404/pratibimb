[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pratibimb"
version = "0.1.0"
description = "Pratibimb: a hybrid physiological + ML digital twin for Type 2 Diabetes (synthetic-data proof of concept)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Team Stack Underflow" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "numba>=0.60",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pratibimb = "pratibimb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pratibimb"]

[tool.hatch.build.targets.wheel.force-include]
"pratibimb/foods/indian_foods.csv" = "pratibimb/foods/indian_foods.csv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
